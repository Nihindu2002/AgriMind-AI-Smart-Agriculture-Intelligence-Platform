services:
  - type: web
    name: agrimind-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: FRONTEND_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://agri-mind-ai-smart-agriculture-inte.vercel.app,https://agri-mind-ai-smart-agriculture-intelligence-platform-8jmjobwq0.vercel.app"
      - key: FRONTEND_ORIGIN_REGEX
        value: "https://agri-mind-ai-smart-agriculture-intelligence-platform-[a-z0-9]+\\.vercel\\.app"
